    <<: *noobscribe-common
    profiles: ["no-traefik"]
    image: ${NOOBSCRIBE_IMAGE:-ghcr.io/meganoob1337/noobscribe:latest}
    build: .
    container_name: noobscribe-api-no-traefik
    depends_on:
