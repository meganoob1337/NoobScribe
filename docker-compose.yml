      - DATABASE_URL=sqlite+aiosqlite:////app/data/noobscribe.db
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_TRANSCRIPTION=${QUEUE_TRANSCRIPTION:-1}
      - LOAD_MODELS_ON_DEMAND=${LOAD_MODELS_ON_DEMAND:-false}
      - SPEAKER_MATCH_MODE=${SPEAKER_MATCH_MODE:-nearest}

  noobscribe-worker:
    <<: *noobscribe-worker-common
    profiles: ["traefik"]
    image: ${NOOBSCRIBE_IMAGE:-ghcr.io/meganoob1337/noobscribe:latest}
    build: .
    container_name: noobscribe-worker
    environment:
      - DEBUG=${DEBUG:-0}
      - ENABLE_DIARIZATION=${ENABLE_DIARIZATION:-true}
      - INCLUDE_DIARIZATION_IN_TEXT=${INCLUDE_DIARIZATION_IN_TEXT:-true}
      - USE_API=${USE_API:-0}
      - STT_BASE_URL=${STT_BASE_URL:-}
      - STT_API_KEY=${STT_API_KEY:-}
      - ASR_MODEL=${ASR_MODEL:-canary-1b-v2}
      - MODEL_PATH=${MODEL_PATH:-}
      - DIARIZATION_MODEL_PATH=${DIARIZATION_MODEL_PATH:-}
      - TEMPERATURE=${TEMPERATURE:-0.0}
      - CHUNK_MIN_DURATION=${CHUNK_MIN_DURATION:-15}
      - CHUNK_MAX_DURATION=${CHUNK_MAX_DURATION:-30}
      - CHUNK_SILENCE_DB=${CHUNK_SILENCE_DB:--40}
      - CHUNK_SILENCE_MIN_DURATION=${CHUNK_SILENCE_MIN_DURATION:-0.3}
      - HUGGINGFACE_ACCESS_TOKEN=${HUGGINGFACE_TOKEN:-}
      - CHROMADB_PATH=/app/data/speakers
      - RECORDINGS_PATH=/app/data/recordings
      - DATABASE_URL=sqlite+aiosqlite:////app/data/noobscribe.db
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_TRANSCRIPTION=${QUEUE_TRANSCRIPTION:-1}
      - LOAD_MODELS_ON_DEMAND=${LOAD_MODELS_ON_DEMAND:-false}
      - SPEAKER_MATCH_MODE=${SPEAKER_MATCH_MODE:-nearest}
    deploy:
      resources:
        reservations:
