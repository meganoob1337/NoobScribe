      - CHUNK_SILENCE_DB=${CHUNK_SILENCE_DB:--40}
      - CHUNK_SILENCE_MIN_DURATION=${CHUNK_SILENCE_MIN_DURATION:-0.3}
      - HUGGINGFACE_ACCESS_TOKEN=${HUGGINGFACE_TOKEN:-}
      - CHROMADB_PATH=/app/data/speakers
      - RECORDINGS_PATH=/app/data/recordings
      - DATABASE_URL=sqlite+aiosqlite:////app/data/noobscribe.db
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_TRANSCRIPTION=${QUEUE_TRANSCRIPTION:-1}
      - LOAD_MODELS_ON_DEMAND=${LOAD_MODELS_ON_DEMAND:-false}
      - SPEAKER_MATCH_MODE=${SPEAKER_MATCH_MODE:-nearest}
    networks:
      - default
      - traefik-global-proxy
    labels: *traefik-labels

  noobscribe-worker-cpu:
    <<: *noobscribe-worker-common
    profiles: ["cpu"]
    image: ${NOOBSCRIBE_IMAGE:-ghcr.io/meganoob1337/noobscribe:latest-cpu}
